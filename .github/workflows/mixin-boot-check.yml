name: Mixin Boot Check

on:
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        version: ["1.21", "1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      # 预下载全部版本的 carpet 到 libs/（flatDir）：boot 阶段不再解析 masa maven，
      # 其可用性波动曾导致 26.3 以外全矩阵 "Server failed to boot"（依赖解析快速失败）。
      # 26.3 正式版未同步到 masa，走 GitHub release。
      - name: Pre-fetch carpet jars into libs/
        run: |
          mkdir -p libs
          for v in $(python -c "import json;print(' '.join(json.load(open('settings.json'))['versions']))"); do
            cv=$(grep '^carpet_core_version=' "versions/$v/gradle.properties" | cut -d= -f2)
            jar="libs/fabric-carpet-$cv.jar"
            if [ ! -f "$jar" ]; then
              url="https://masa.dy.fi/maven/carpet/fabric-carpet/$cv/fabric-carpet-$cv.jar"
              if [ "$v" = "26.3" ]; then
                url="https://github.com/gnembon/fabric-carpet/releases/download/v26.3/fabric-carpet-26.3%2Bv260915.jar"
              fi
              curl -sfL --retry 3 -o "$jar" "$url" || echo "::warning::carpet $cv 预下载失败：$url"
            fi
          done
          ls -la libs/

      - name: Boot server and check mixin application
        run: |
          mkdir -p ./run
          echo eula=true > ./run/eula.txt
          set +e
          timeout 420 ./gradlew ${{ matrix.version }}:runServer --console=plain > boot.log 2>&1
          set -e
          echo "--- boot.log tail ---"
          tail -n 30 boot.log
          if grep -qiE "MixinApplyError|Critical injection failure|InvalidMixinException|InjectionError|Error applying mixin" boot.log; then
            echo "::error::Mixin application error detected on ${{ matrix.version }}"
            grep -inE "mixin" boot.log | tail -n 40 || true
            exit 1
          fi
          if ! grep -q "Done" boot.log; then
            echo "::error::Server failed to boot on ${{ matrix.version }}"
            exit 1
          fi
          echo "Mixin boot check passed for ${{ matrix.version }}"

      - name: Upload boot.log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-log-${{ matrix.version }}
          path: boot.log
          retention-days: 3
